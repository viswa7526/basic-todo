<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="600" y1="0" x2="600" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F5FF"/>
      <stop offset="1" stop-color="#F8F9FC"/>
    </linearGradient>
    <linearGradient id="card" x1="600" y1="90" x2="600" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFBFF"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8179F4"/>
      <stop offset="1" stop-color="#6258E8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#1B2646" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="125" cy="85" r="96" fill="#E9E9FF" opacity="0.8"/>
  <circle cx="1080" cy="700" r="120" fill="#EEF2FF" opacity="0.9"/>

  <g filter="url(#shadow)">
    <rect x="240" y="92" width="720" height="620" rx="30" fill="url(#card)" stroke="#EAEFFE"/>
  </g>

  <g>
    <rect x="290" y="146" width="36" height="36" rx="12" fill="#6258E8"/>
    <path d="M302 165L308 171L319 160" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="340" y="171" fill="#333D54" font-family="Arial, sans-serif" font-size="22" font-weight="700">focus</text>
  </g>

  <text x="290" y="232" fill="#6258E8" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">YOUR PERSONAL WORKSPACE</text>
  <text x="290" y="272" fill="#172033" font-family="Arial, sans-serif" font-size="42" font-weight="700">Make today count.</text>
  <text x="290" y="307" fill="#788196" font-family="Arial, sans-serif" font-size="19">A little progress each day adds up to big results.</text>

  <rect x="290" y="336" width="620" height="92" rx="16" fill="#F8F8FF" stroke="#EEEFF7"/>
  <text x="316" y="369" fill="#788196" font-family="Arial, sans-serif" font-size="12" font-weight="600">Today's progress</text>
  <text x="316" y="402" fill="#172033" font-family="Arial, sans-serif" font-size="19" font-weight="700">2 of 4 completed</text>

  <rect x="760" y="363" width="126" height="8" rx="4" fill="#E8E9F2"/>
  <rect x="760" y="363" width="70" height="8" rx="4" fill="url(#button)"/>
  <text x="900" y="373" fill="#788196" font-family="Arial, sans-serif" font-size="12" font-weight="700">50%</text>

  <rect x="290" y="454" width="542" height="54" rx="12" fill="#FFFFFF" stroke="#E4E7EF"/>
  <circle cx="315" cy="481" r="8" fill="#D9DDF2"/>
  <path d="M310 481H320" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M315 476V486" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <text x="338" y="487" fill="#A0A7B6" font-family="Arial, sans-serif" font-size="18">What needs to get done?</text>

  <g>
    <rect x="844" y="454" width="66" height="54" rx="12" fill="url(#button)"/>
    <path d="M869 474V492M860 483H878" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <text x="819" y="487" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="700">Add</text>
  </g>

  <g>
    <text x="290" y="542" fill="#30394C" font-family="Arial, sans-serif" font-size="16" font-weight="700">Your tasks</text>
    <rect x="676" y="524" width="234" height="31" rx="9" fill="#F4F5F9"/>
    <rect x="682" y="529" width="43" height="21" rx="7" fill="#FFFFFF"/>
    <text x="695" y="544" fill="#172033" font-family="Arial, sans-serif" font-size="11" font-weight="700">All</text>
    <text x="738" y="544" fill="#788196" font-family="Arial, sans-serif" font-size="11" font-weight="700">Active</text>
    <text x="803" y="544" fill="#788196" font-family="Arial, sans-serif" font-size="11" font-weight="700">Done</text>
  </g>

  <g>
    <rect x="290" y="563" width="620" height="62" rx="12" fill="#FFFFFF" stroke="#E9ECF2"/>
    <circle cx="318" cy="594" r="8" fill="#34A77A" fill-opacity="0.12" stroke="#34A77A" stroke-width="1.6"/>
    <path d="M312 595L316 599L323 592" stroke="#34A77A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="338" y="600" fill="#30394C" font-family="Arial, sans-serif" font-size="16">Finish landing page copy</text>
    <path d="M872 578L880 586L894 572" stroke="#AEB4C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <rect x="290" y="635" width="620" height="62" rx="12" fill="#FFFFFF" stroke="#E9ECF2"/>
    <circle cx="318" cy="666" r="8" fill="#FFFFFF" stroke="#CFD6E7" stroke-width="2"/>
    <text x="338" y="671" fill="#30394C" font-family="Arial, sans-serif" font-size="16">Review sprint notes</text>
    <rect x="856" y="649" width="28" height="28" rx="8" fill="#F7F8FC" stroke="#D9DDE9"/>
    <path d="M865 661L871 667L881 657" stroke="#929AAB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="290" y="722" fill="#788196" font-family="Arial, sans-serif" font-size="12" font-weight="600">2 tasks left</text>
  <text x="843" y="722" fill="#6258E8" font-family="Arial, sans-serif" font-size="12" font-weight="700">Clear completed</text>
</svg>
